# https://taskfile.dev
version: '3'

dotenv: ['.env']

tasks:
  default:
    desc: 利用可能なタスク一覧を表示
    cmds:
      - task --list
    silent: true

  # ============================================================================
  # 🚀 開発 & サーバー実行タスク
  # ============================================================================
  dev:
    desc: AegisCMS コアサーバーを起動 (ポート 8080)
    cmds:
      - cargo run -p aegis-server -- run {{.CLI_ARGS}}

  dev:admin:
    desc: Admin Studio フロントエンド開発サーバーを起動 (Vite HMR)
    cmds:
      - npm --prefix admin run dev

  migrate:
    desc: 宣言的スキーマの SQLite 自動マイグレーションを実行
    cmds:
      - cargo run -p aegis-server -- migrate

  # ============================================================================
  # ⚙️ コード生成タスク (TypeScript / OpenAPI)
  # ============================================================================
  codegen:
    desc: スキーマから TypeScript 型定義および OpenAPI 仕様を一括生成
    cmds:
      - task: codegen:ts
      - task: codegen:openapi

  codegen:ts:
    desc: スキーマから TypeScript 型定義を自動生成 (admin/src/types/schemas.ts)
    cmds:
      - cargo run -p aegis-server -- codegen --target typescript --output admin/src/types/schemas.ts

  codegen:openapi:
    desc: スキーマから OpenAPI 3.1 仕様書を自動生成 (docs/openapi.json)
    cmds:
      - cargo run -p aegis-server -- codegen --target openapi --output docs/openapi.json

  # ============================================================================
  # 🔍 テスト・リント・コード品質タスク (ゼロ警告ポリシー)
  # ============================================================================
  test:
    desc: ワークスペース内の全クレートでテストを実行
    cmds:
      - cargo test --workspace {{.CLI_ARGS}}

  lint:
    desc: Clippy による静的解析を実行 (ゼロ警告ポリシー)
    cmds:
      - cargo clippy --workspace -- -D warnings

  lint:admin:
    desc: oxlint による Admin Studio の静的解析を実行 (ゼロ警告ポリシー)
    cmds:
      - npm --prefix admin run lint

  fmt:
    desc: rustfmt によるコードフォーマットを適用
    cmds:
      - cargo fmt

  fmt:check:
    desc: rustfmt によるコードフォーマットを検証
    cmds:
      - cargo fmt --check

  fmt:admin:
    desc: Prettier で Admin Studio のコードフォーマットを適用
    cmds:
      - npm --prefix admin run format

  fmt:admin:check:
    desc: Prettier で Admin Studio のコードフォーマットを検証
    cmds:
      - npm --prefix admin run format:check

  check:
    desc: PR・コミット前の全検証チェックを一括実行 (fmt, prettier, clippy, oxlint, test, admin:build)
    cmds:
      - task: fmt:check
      - task: fmt:admin:check
      - task: lint
      - task: lint:admin
      - task: test
      - task: build:admin
    summary: |
      AGENTS.md の PR 作成前チェックリスト（フォーマット検証 rustfmt / Prettier、Clippy / oxlint、全テスト、フロントエンドビルド）を
      すべて順次実行して検証します。

  # ============================================================================
  # 🏗️ ビルドタスク
  # ============================================================================
  build:
    desc: バックエンドおよびフロントエンドの本番ビルドを一括実行
    cmds:
      - task: build:admin
      - task: build:server

  build:server:
    desc: aegis-server コアエンジンの最適化リリースバイナリをビルド
    cmds:
      - cargo build --release -p aegis-server

  build:admin:
    desc: Admin Studio フロントエンドの本番バンドルをビルド (admin/dist/)
    cmds:
      - npm --prefix admin run build

  build:wasm:
    desc: サンプル Wasm プラグイン (sdk/examples/slack-notifier/plugin.wasm) を生成
    cmds:
      - cargo run -p aegis-runtime --bin build_sample_wasm

  plugin:build:
    desc: Rust プラグインテンプレートを Wasm にビルドし sdk/templates/rust/plugin.wasm を更新 (要 rustup target add wasm32-unknown-unknown)
    cmds:
      - cargo build -p aegis-plugin-template --target wasm32-unknown-unknown --release
      - cmd: cmd /c "copy /y target\\wasm32-unknown-unknown\\release\\aegis_plugin_template.wasm sdk\\templates\\rust\\plugin.wasm"
        platforms: [windows]
      - cmd: cp target/wasm32-unknown-unknown/release/aegis_plugin_template.wasm sdk/templates/rust/plugin.wasm
        platforms: [linux, darwin]

  plugin:build:code-enhancer:
    desc: 公式 Code Enhancer プラグインを Wasm にビルドし plugins/official-code-enhancer/plugin.wasm を生成
    cmds:
      - cargo build -p aegis-plugin-code-enhancer --target wasm32-unknown-unknown --release
      - cmd: cmd /c "copy /y target\\wasm32-unknown-unknown\\release\\aegis_plugin_code_enhancer.wasm plugins\\official-code-enhancer\\plugin.wasm"
        platforms: [windows]
      - cmd: cp target/wasm32-unknown-unknown/release/aegis_plugin_code_enhancer.wasm plugins/official-code-enhancer/plugin.wasm
        platforms: [linux, darwin]

  plugin:build:shop:
    desc: 公式 EC プラグイン (official-shop-rules / official-order-notifier) を Wasm にビルドし plugins/*/plugin.wasm を更新
    cmds:
      - cargo build -p aegis-plugin-shop-rules -p aegis-plugin-order-notifier --target wasm32-unknown-unknown --release
      - cmd: cmd /c "copy /y target\\wasm32-unknown-unknown\\release\\aegis_plugin_shop_rules.wasm plugins\\official-shop-rules\\plugin.wasm && copy /y target\\wasm32-unknown-unknown\\release\\aegis_plugin_order_notifier.wasm plugins\\official-order-notifier\\plugin.wasm"
        platforms: [windows]
      - cmd: cp target/wasm32-unknown-unknown/release/aegis_plugin_shop_rules.wasm plugins/official-shop-rules/plugin.wasm && cp target/wasm32-unknown-unknown/release/aegis_plugin_order_notifier.wasm plugins/official-order-notifier/plugin.wasm
        platforms: [linux, darwin]

  plugin:build:as:
    desc: AssemblyScript プラグインテンプレートを Wasm にビルドし sdk/templates/assemblyscript/plugin.wasm を生成
    cmds:
      - npm --prefix sdk/templates/assemblyscript run build

  bench:
    desc: AegisCMS サーバーの主要エンドポイント HTTP パフォーマンスベンチマークを実行 (bench:http のエイリアス)
    cmds:
      - task: bench:http
        vars: { CLI_ARGS: '{{.CLI_ARGS}}' }

  bench:http:
    desc: HTTP ベンチマークを実行 (トップページ、記事、API、プレビュー、見積もり等。要サーバー起動または --auto-server)
    cmds:
      - node scripts/benchmark.mjs {{.CLI_ARGS}}

  bench:http:quick:
    desc: HTTP ベンチマークを短時間 (並行 20、各 2 秒) でクイック実行
    cmds:
      - node scripts/benchmark.mjs -c 20 -d 2 {{.CLI_ARGS}}

  bench:http:stress:
    desc: HTTP ベンチマークを高負荷 (並行 100、各 10 秒) でストレステスト実行
    cmds:
      - node scripts/benchmark.mjs -c 100 -d 10 {{.CLI_ARGS}}

  bench:plugins:
    desc: Wasm プラグインのフック 1 回あたりの所要時間（段階別）と同時実行時のスループットを計測 (sdk/ と plugins/ のプラグイン)
    cmds:
      - cargo run --release -p aegis-runtime --example plugin_profile

  bench:all:
    desc: プラグイン性能計測 (bench:plugins) と HTTP ベンチマーク (bench:http) を一括実行
    cmds:
      - task: bench:plugins
      - task: bench:http

  plugin:build:tinygo:
    desc: TinyGo プラグインテンプレートを Wasm にビルドし sdk/templates/tinygo/plugin.wasm を生成 (要 TinyGo 0.31+)
    cmds:
      - cmd: cmd /c "cd sdk\\templates\\tinygo && tinygo build -target=wasm-unknown -opt=z -no-debug -o plugin.wasm main.go"
        platforms: [windows]
      - cmd: "cd sdk/templates/tinygo && tinygo build -target=wasm-unknown -opt=z -no-debug -o plugin.wasm main.go"
        platforms: [linux, darwin]


  # ============================================================================
  # ☕ サンプルショップ（examples/coffee-shop）
  # ============================================================================
  demo:shop:user:
    desc: サンプルショップの管理者 owner を作成 (パスワード sample-password。作成済みなら何もしない)
    env:
      AEGIS_USER_PASSWORD: sample-password
    cmds:
      - cmd: cargo run -p aegis-server -- -c examples/coffee-shop/aegis.toml user add owner --role admin --display-name 店主
        ignore_error: true

  demo:shop:
    desc: サンプルショップ「朝凪珈琲」を起動 (http://127.0.0.1:8080。初回は別のターミナルで task demo:shop:seed)
    deps: [demo:shop:user]
    cmds:
      - cargo run -p aegis-server -- -c examples/coffee-shop/aegis.toml run

  demo:shop:seed:
    desc: 起動中のサンプルショップに商品・記事・ページを投入 (要 Node.js 18+。何度実行してもよい)
    cmds:
      - node examples/coffee-shop/seed.mjs {{.CLI_ARGS}}

  # ============================================================================
  # 🐳 Docker タスク
  # ============================================================================
  docker:build:
    desc: 本番対応マルチステージ Docker イメージをビルド (aegiscms:latest)
    cmds:
      - docker build -t aegiscms:latest .

  docker:run:
    desc: Docker コンテナをバックグラウンドで起動 (ポート 8080)
    cmds:
      - docker run -d --name aegiscms -p 8080:8080 -v aegis-data:/app/data aegiscms:latest

  docker:stop:
    desc: 実行中の Docker コンテナを停止・削除
    cmds:
      - docker rm -f aegiscms

  docker:logs:
    desc: Docker コンテナのログをリアルタイム表示
    cmds:
      - docker logs -f aegiscms

  docker:dbs:up:
    desc: 実機検証用 DB コンテナ (PostgreSQL 16 / MySQL 8.0) を起動
    cmds:
      - docker compose -f docker-compose.test-dbs.yml up -d --wait

  docker:dbs:down:
    desc: 実機検証用 DB コンテナ (PostgreSQL 16 / MySQL 8.0) を停止・削除
    cmds:
      - docker compose -f docker-compose.test-dbs.yml down -v

  test:dbs:
    desc: PostgreSQL / MySQL 実機コンテナ環境で注文・在庫の統合テストを一括実行
    deps: [docker:dbs:up]
    cmds:
      - cargo test -p aegis-db --test orders_integration -- --nocapture
      - cargo test -p aegis-server -- test_postgres_order_and_stock_e2e --nocapture
      - cargo test -p aegis-server -- test_mysql_order_and_stock_e2e --nocapture

  # ============================================================================
  # 🧹 メンテナンス & クリーンアップ
  # ============================================================================
  clean:
    desc: ビルド生成物 (target/, admin/dist/) をクリーンアップ
    cmds:
      - cargo clean
      - cmd: cmd /c "if exist admin\\dist rmdir /s /q admin\\dist"
        platforms: [windows]
      - cmd: rm -rf admin/dist
        platforms: [linux, darwin]
