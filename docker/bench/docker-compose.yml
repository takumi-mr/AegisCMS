# AegisCMS と WordPress の比較ベンチマーク用の使い捨て環境（docs/benchmark.md）。
# どれも Docker 内で動かし、CPU を同じだけ割り当てる。負荷は同じネットワークの wrk から掛ける。
name: aegisbench

x-app-limits: &app-limits
  cpus: 2
  mem_limit: 2g

services:
  # ---- AegisCMS（SQLite。プラグインなし・既定のテーマ）
  aegis:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: aegiscms-bench:local
    command: ["run"]
    <<: *app-limits
    volumes:
      - aegis-data:/app/data
      - ./aegis.toml:/app/config/docker.toml:ro
    ports: ["18311:8080"]

  # AegisCMS の前に置くページキャッシュ（nginx proxy_cache）
  aegis-cache:
    image: nginx:stable-alpine
    depends_on: [aegis]
    cpus: 2
    mem_limit: 512m
    volumes:
      - ./nginx-aegis-cache.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["18312:80"]

  # ---- WordPress（php-fpm + MariaDB。既定のテーマ・プラグインなし）
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
      MARIADB_ROOT_PASSWORD: root
    cpus: 2
    mem_limit: 2g
    volumes:
      - wp-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

  wp:
    image: wordpress:6-php8.3-fpm
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wordpress
    cpus: 2
    mem_limit: 2g
    volumes:
      - wp-html:/var/www/html
      - ./php-fpm-bench.conf:/usr/local/etc/php-fpm.d/zz-bench.conf:ro

  wp-nocache:
    image: nginx:stable-alpine
    depends_on: [wp]
    cpus: 2
    mem_limit: 512m
    volumes:
      - wp-html:/var/www/html:ro
      - ./nginx-wp-nocache.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["18301:80"]

  wp-cache:
    image: nginx:stable-alpine
    depends_on: [wp]
    cpus: 2
    mem_limit: 512m
    volumes:
      - wp-html:/var/www/html:ro
      - ./nginx-wp-cache.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["18302:80"]

  wpcli:
    image: wordpress:cli
    profiles: ["setup"]
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp-html:/var/www/html

  # 負荷（同じネットワークの中から。ホストの Node より高い負荷まで測れる）
  wrk:
    image: williamyeh/wrk
    profiles: ["load"]
    entrypoint: ["wrk"]

volumes:
  aegis-data:
  wp-db:
  wp-html:
