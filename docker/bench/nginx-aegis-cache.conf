# AegisCMS のページキャッシュ（nginx proxy_cache）。Authorization ヘッダーや Cookie のあるリクエストは通さない
# （会員限定ページは AegisCMS が `private, no-store` を返すので、そもそもキャッシュされない）
proxy_cache_path /tmp/aegiscache levels=1:2 keys_zone=aegis:50m inactive=60m max_size=500m;

server {
    listen 80;
    server_name _;

    set $skip_cache 0;
    if ($request_method = POST) { set $skip_cache 1; }
    if ($http_authorization != "") { set $skip_cache 1; }
    if ($http_cookie != "") { set $skip_cache 1; }

    location / {
        proxy_pass http://aegis:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        # AegisCMS は一覧ページで Cache-Tag / Surrogate-Key が 1.5KB ずつ付く（nginx の既定 4KB を超える）
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_set_header Connection "";
        proxy_cache aegis;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 10m;
        proxy_cache_bypass $skip_cache;
        proxy_no_cache $skip_cache;
        add_header X-Cache $upstream_cache_status;
    }
}
