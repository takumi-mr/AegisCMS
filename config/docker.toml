[server]
host = "0.0.0.0"
port = 8080
# Path to serve under behind a reverse proxy, e.g. "/cms" for https://example.com/cms/ (empty: the root).
# See docs/configuration.md "リバースプロキシ配下での運用"
base_path = ""

[database]
# Backend: "sqlite" | "postgres" | "mysql" (auto-inferred from url if omitted)
backend = "sqlite"
url = "sqlite:///app/data/aegis.db?mode=rwc"
max_connections = 10

[storage]
# Backend: "local" (disk/volume mount) | "s3" (AWS S3 / Cloudflare R2 / MinIO)
backend = "local"
# Maximum size of a single upload, in MB (responds 413 when exceeded)
max_upload_mb = 10

[storage.local]
upload_dir = "/app/data/uploads"
public_url_prefix = "/uploads"

[storage.s3]
bucket = "aegis-bucket"
region = "auto"
# endpoint = "https://<account_id>.r2.cloudflarestorage.com"
# access_key_id = "..."
# secret_access_key = "..."
# force_path_style = false
# public_url_prefix = "https://cdn.example.com"

[cache]
# Backend: "memory" (default, in-memory TTL cache) | "redis" (distributed cache & stateless sessions)
backend = "memory"
default_ttl_secs = 3600

[cache.redis]
url = "redis://redis:6379"
timeout_ms = 2000

[paths]
schemas_dir = "schemas"
plugins_dir = "plugins"
admin_dist_dir = "admin/dist"
themes_dir = "themes"

[runtime]
enable_wasm_plugins = true
default_max_memory_mb = 16
default_max_fuel_units = 100000000
default_timeout_ms = 250

[plugins]
# Plugins to load, by name (installed as <plugins_dir>/<name>/ with a plugin.manifest.json).
# Hooks run in this order. The server does not start if a listed plugin is missing or cannot load.
# Templates and samples live in sdk/; see docs/plugin_hooks.md "インストールと有効化"
enabled = []

[security]
enforce_external_link_rel = true
open_external_links_in_new_tab = false
internal_domains = []
enforce_image_lazy_loading = true
enforce_image_async_decoding = true

[audit]
enabled = true
# Sinks: "database" (audit_logs table + GET /api/v1/audit-logs) | "log" (JSON lines on the aegis::audit target) | "prometheus" (GET /metrics)
sinks = ["database"]
# Use the first X-Forwarded-For address as the client IP for audit logs and login rate limits
# (enable only behind a trusted reverse proxy)
trust_forwarded_for = false
# Days to keep audit events in the database sink; older events are purged periodically (0 = keep forever)
retention_days = 0
# How often to purge expired audit events, in seconds (minimum 60)
purge_interval_secs = 3600

[auth.login_rate_limit]
# Temporarily lock logins (POST /api/v1/auth/session) after repeated failures.
# Failures are counted in the [cache] backend, so use "redis" to share the limits across servers.
enabled = true
# Failed logins per username / per client IP within window_secs before locking (0 = unlimited)
max_failures_per_user = 5
max_failures_per_ip = 20
window_secs = 900
# How long a lock lasts, in seconds (logins are rejected with 429 even with the right password)
lockout_secs = 900

[theme]
active = "default"
site_title = "AegisCMS Production"
site_description = "Next-Generation High-Performance Secure CMS"
# Articles per page on the index page (/?page=N)
posts_per_page = 10
# Re-read theme templates on every render (for theme development; keep false in production)
reload_templates = false

