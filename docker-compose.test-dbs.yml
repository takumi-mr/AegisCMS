services:
  postgres:
    image: postgres:16-alpine
    container_name: aegis-test-postgres
    restart: "no"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: aegis_test
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis_test"]
      interval: 2s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.0
    container_name: aegis-test-mysql
    restart: "no"
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: aegis_test
      MYSQL_USER: aegis
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "aegis", "-ppassword"]
      interval: 3s
      timeout: 5s
      retries: 15
