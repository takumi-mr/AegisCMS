content_type: article
label: "技術記事"
description: "技術ブログ記事やドキュメント向けのスキーマ"
fields:
  - name: excerpt
    type: string
    required: false
    max_length: 500
  - name: category_id
    type: relation
    target: category.id
    required: false
    nullable: true
    index: true
  - name: custom_meta
    type: jsonb
    indexed_paths:
      - "seo.canonical_url"
