<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>
    <linearGradient id="neon-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#ff7700" />
    </linearGradient>
    <pattern id="cyber-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 240, 255, 0.07)" stroke-width="1" />
    </pattern>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Cyber Background -->
  <rect width="800" height="500" fill="#07090e" />
  <rect width="800" height="500" fill="url(#cyber-grid)" />

  <!-- Neon Ambient Lights -->
  <circle cx="150" cy="80" r="120" fill="#00f0ff" opacity="0.1" filter="url(#neon-glow)" />
  <circle cx="680" cy="220" r="160" fill="#ff007f" opacity="0.08" filter="url(#neon-glow)" />

  <!-- Cyber Header -->
  <rect x="60" y="40" width="680" height="54" fill="#0c1017" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.4" />
  <rect x="80" y="52" width="28" height="28" fill="#00f0ff" fill-opacity="0.15" stroke="#00f0ff" stroke-width="1.5" />
  <text x="94" y="71" fill="#00f0ff" font-family="'Courier New', monospace" font-weight="900" font-size="16" text-anchor="middle">&gt;_</text>
  <text x="122" y="73" fill="#ffffff" font-family="'Courier New', monospace" font-weight="700" font-size="16" letter-spacing="2">TOKYO//NEON</text>
  <rect x="610" y="52" width="110" height="28" fill="rgba(255,0,127,0.15)" stroke="#ff007f" stroke-width="1" />
  <text x="665" y="70" fill="#ff007f" font-family="'Courier New', monospace" font-weight="700" font-size="11" letter-spacing="1" text-anchor="middle">ONLINE :: 2077</text>

  <!-- Cyber Terminal Hero -->
  <text x="60" y="145" fill="#00f0ff" font-family="'Courier New', monospace" font-weight="600" font-size="13" letter-spacing="2">// NEURAL PROTOCOL CONNECTED</text>
  <text x="60" y="188" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="1">SYNTHWAVE SANDBOX</text>
  <text x="60" y="218" fill="#8892b0" font-family="'Courier New', monospace" font-size="13">High-octane WebAssembly runtime with zero-latency streaming rewriter.</text>

  <!-- Cyber Cards -->
  <g>
    <!-- Card 1 -->
    <rect x="60" y="255" width="325" height="190" fill="#0c1017" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.7" />
    <polygon points="60,255 85,255 60,280" fill="#00f0ff" />
    <rect x="85" y="280" width="80" height="20" fill="rgba(0,240,255,0.15)" />
    <text x="125" y="294" fill="#00f0ff" font-family="'Courier New', monospace" font-weight="700" font-size="10" text-anchor="middle">SUB-MS REWRITE</text>
    <text x="85" y="330" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="17">Cybernetic AST Engine</text>
    <text x="85" y="356" fill="#8892b0" font-family="'Courier New', monospace" font-size="11">Streaming lol-html tokens with auto rel="noopener" injection.</text>
    <text x="85" y="415" fill="#00f0ff" font-family="'Courier New', monospace" font-weight="700" font-size="12">[ EXECUTE PROTOCOL ]</text>

    <!-- Card 2 -->
    <rect x="415" y="255" width="325" height="190" fill="#0c1017" stroke="#ff007f" stroke-width="1.5" stroke-opacity="0.7" />
    <polygon points="415,255 440,255 415,280" fill="#ff007f" />
    <rect x="440" y="280" width="80" height="20" fill="rgba(255,0,127,0.15)" />
    <text x="480" y="294" fill="#ff007f" font-family="'Courier New', monospace" font-weight="700" font-size="10" text-anchor="middle">SECURE MATRIX</text>
    <text x="440" y="330" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="17">Wasm Shield Architecture</text>
    <text x="440" y="356" fill="#8892b0" font-family="'Courier New', monospace" font-size="11">Zero-Trust sandbox guarding memory vectors from exploits.</text>
    <text x="440" y="415" fill="#ff007f" font-family="'Courier New', monospace" font-weight="700" font-size="12">[ VIEW TELEMETRY ]</text>
  </g>
</svg>
