<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Editorial Warm Paper Background -->
  <rect width="800" height="500" fill="#faf8f5" />

  <!-- Clean Border / Grid Accent -->
  <line x1="60" y1="105" x2="740" y2="105" stroke="#e7e5e4" stroke-width="1.5" />
  <line x1="60" y1="245" x2="740" y2="245" stroke="#e7e5e4" stroke-width="1" />

  <!-- Masthead -->
  <text x="60" y="70" fill="#a8a29e" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" letter-spacing="3">ISSUE N° 42 AUTUMN 2026</text>
  <text x="60" y="95" fill="#1c1917" font-family="'Georgia', 'Times New Roman', serif" font-weight="700" font-size="24" letter-spacing="-0.5">The Nordic Review</text>

  <rect x="655" y="62" width="85" height="28" rx="4" fill="none" stroke="#1c1917" stroke-width="1" />
  <text x="697.5" y="80" fill="#1c1917" font-family="-apple-system, sans-serif" font-weight="600" font-size="10" letter-spacing="1" text-anchor="middle">SUBSCRIBE</text>

  <!-- Featured Lead Article -->
  <g>
    <text x="60" y="140" fill="#991b1b" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" letter-spacing="2">ESSAY ARCHITECTURE</text>
    <text x="60" y="175" fill="#1c1917" font-family="'Georgia', serif" font-weight="700" font-size="28" letter-spacing="-0.5">Form, Memory, and the Digital Sanctuary</text>
    <text x="60" y="206" fill="#57534e" font-family="'Georgia', serif" font-size="14" font-style="italic">An exploration of restrained minimalism in modern computational architecture and prose.</text>
    <text x="60" y="230" fill="#78716c" font-family="-apple-system, sans-serif" font-size="11">By Helena Lindqvist 8 min read</text>
  </g>

  <!-- Two Column Layout Below -->
  <g filter="url(#soft-shadow)">
    <!-- Column 1 -->
    <rect x="60" y="270" width="325" height="180" rx="4" fill="#ffffff" stroke="#f5f5f4" stroke-width="1" />
    <text x="85" y="305" fill="#a8a29e" font-family="-apple-system, sans-serif" font-weight="600" font-size="10" letter-spacing="2">DISPATCH</text>
    <text x="85" y="338" fill="#1c1917" font-family="'Georgia', serif" font-weight="700" font-size="18">The Quiet Power of Typography</text>
    <text x="85" y="365" fill="#78716c" font-family="'Georgia', serif" font-size="12">Why generous whitespace and deliberate kerning calm the modern reader's mind.</text>
    <line x1="85" y1="410" x2="165" y2="410" stroke="#991b1b" stroke-width="1.5" />
    <text x="85" y="405" fill="#991b1b" font-family="-apple-system, sans-serif" font-weight="600" font-size="11">Read Article</text>

    <!-- Column 2 -->
    <rect x="415" y="270" width="325" height="180" rx="4" fill="#ffffff" stroke="#f5f5f4" stroke-width="1" />
    <text x="440" y="305" fill="#a8a29e" font-family="-apple-system, sans-serif" font-weight="600" font-size="10" letter-spacing="2">CRITIQUE</text>
    <text x="440" y="338" fill="#1c1917" font-family="'Georgia', serif" font-weight="700" font-size="18">Sandboxes as Safe Harbors</text>
    <text x="440" y="365" fill="#78716c" font-family="'Georgia', serif" font-size="12">How deterministic WebAssembly boundaries protect human creativity from chaos.</text>
    <line x1="440" y1="410" x2="520" y2="410" stroke="#991b1b" stroke-width="1.5" />
    <text x="440" y="405" fill="#991b1b" font-family="-apple-system, sans-serif" font-weight="600" font-size="11">Read Article</text>
  </g>
</svg>
