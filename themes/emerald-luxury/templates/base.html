<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if title %}{{ title }} | {% endif %}{{ site_title }}</title>
  <meta name="description" content="{% if site_description %}{{ site_description }}{% else %}{{ site_title }}{% endif %}">
  <link rel="stylesheet" href="{{ base_path }}/theme/assets/style.css">
  {% if extra_css %}
  <style>{{ extra_css | safe }}</style>
  {% endif %}
  {{ extra_head | safe }}
</head>
<body>
  <div class="lux-ambient"></div>
  <header class="lux-header">
    <div class="lux-header-inner">
      <a href="{{ base_path }}/" class="lux-brand">
        <span class="lux-brand-orb"></span>
        <span>{{ site_title }}</span>
      </a>
      <nav class="lux-nav">
        <a href="{{ base_path }}/" class="lux-nav-link">Atelier</a>
        <a href="{{ base_path }}/articles" class="lux-nav-link">Exhibits</a>
        <a href="{{ base_path }}/admin/" class="lux-admin-link">Console</a>
      </nav>
    </div>
  </header>

  <main class="lux-main">
    {% block content %}{% endblock %}
  </main>

  <footer class="lux-footer">
    <p>&copy; {{ site_title }}.{% if show_powered_by %} Form and Function Secured by <strong>AegisCMS</strong>.{% endif %}</p>
  </footer>
</body>
</html>
