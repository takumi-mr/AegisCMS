<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <radialGradient id="emerald-ambient" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#050807" stop-opacity="0" />
    </radialGradient>
    <filter id="luxury-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="800" height="500" fill="#050807" />
  <rect width="800" height="400" fill="url(#emerald-ambient)" />

  <!-- Thin Gold Ambient Border -->
  <rect x="25" y="20" width="750" height="460" fill="none" stroke="url(#gold-grad)" stroke-width="1" stroke-opacity="0.25" />

  <!-- Navbar -->
  <g>
    <rect x="60" y="45" width="680" height="54" rx="2" fill="#080e0b" stroke="#10b981" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="90" cy="72" r="12" fill="url(#emerald-grad)" />
    <text x="115" y="78" fill="#fef3c7" font-family="'Times New Roman', serif" font-weight="700" font-size="16" letter-spacing="3">MAISON AEGIS</text>
    <rect x="635" y="58" width="85" height="28" fill="none" stroke="url(#gold-grad)" stroke-width="1" />
    <text x="677.5" y="76" fill="#fde68a" font-family="sans-serif" font-weight="600" font-size="10" letter-spacing="2" text-anchor="middle">ATELIER</text>
  </g>

  <!-- Hero -->
  <text x="60" y="150" fill="#10b981" font-family="sans-serif" font-weight="700" font-size="11" letter-spacing="3">HAUTE COMPUTATION</text>
  <text x="60" y="190" fill="#ffffff" font-family="'Times New Roman', serif" font-weight="700" font-size="34" letter-spacing="1">The Obsidian Monolith</text>
  <text x="60" y="222" fill="#9ca3af" font-family="sans-serif" font-size="14">Curated architectural reflections enveloped in emerald reflections and brushed gold.</text>

  <!-- Luxury Cards Grid -->
  <g filter="url(#luxury-shadow)">
    <!-- Card 1 -->
    <rect x="60" y="260" width="325" height="185" rx="2" fill="#080d0a" stroke="rgba(16,185,129,0.3)" stroke-width="1" />
    <line x1="60" y1="260" x2="385" y2="260" stroke="url(#gold-grad)" stroke-width="2" />
    <text x="85" y="295" fill="#f59e0b" font-family="sans-serif" font-weight="700" font-size="10" letter-spacing="2">COLLECTION I</text>
    <text x="85" y="328" fill="#ffffff" font-family="'Times New Roman', serif" font-weight="700" font-size="18">Deterministic Sandboxing</text>
    <text x="85" y="355" fill="#9ca3af" font-family="sans-serif" font-size="12">
        <tspan x="85" dy="0">Crafted with surgical precision in Rust, </tspan>
        <tspan x="85" dy="1.2em">safeguarding your sovereign content.</tspan>
    </text>
    <text x="85" y="415" fill="#10b981" font-family="sans-serif" font-weight="600" font-size="11" letter-spacing="1">View Artifact</text>

    <!-- Card 2 -->
    <rect x="415" y="260" width="325" height="185" rx="2" fill="#080d0a" stroke="rgba(16,185,129,0.3)" stroke-width="1" />
    <line x1="415" y1="260" x2="740" y2="260" stroke="url(#gold-grad)" stroke-width="2" />
    <text x="440" y="295" fill="#f59e0b" font-family="sans-serif" font-weight="700" font-size="10" letter-spacing="2">COLLECTION II</text>
    <text x="440" y="328" fill="#ffffff" font-family="'Times New Roman', serif" font-weight="700" font-size="18">The Sovereign Astrolabe</text>
    <text x="440" y="355" fill="#9ca3af" font-family="sans-serif" font-size="12">
        <tspan x="440" dy="0">Sub-millisecond templating ensuring</tspan>
        <tspan x="440" dy="1.2em">unmatched clarity and timeless distinction.</tspan>
    </text>
    <text x="440" y="415" fill="#10b981" font-family="sans-serif" font-weight="600" font-size="11" letter-spacing="1">View Artifact</text>
  </g>
</svg>
