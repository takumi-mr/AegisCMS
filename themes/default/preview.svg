<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0a0e17" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-grad)" />
  <rect width="800" height="350" fill="url(#glow)" />

  <!-- Navbar -->
  <rect x="60" y="40" width="680" height="56" rx="14" fill="#111827" fill-opacity="0.8" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <rect x="84" y="54" width="28" height="28" rx="7" fill="url(#accent-grad)" />
  <path d="M98 60 L104 74 L92 74 Z" fill="#ffffff" opacity="0.9" />
  <text x="124" y="73" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" letter-spacing="-0.5">Aegis Horizon</text>
  <rect x="630" y="54" width="86" height="28" rx="14" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.3)" stroke-width="1" />
  <text x="673" y="72" fill="#a5b4fc" font-family="sans-serif" font-weight="600" font-size="11" text-anchor="middle">Official</text>

  <!-- Hero Content -->
  <text x="60" y="150" fill="#9ca3af" font-family="sans-serif" font-weight="600" font-size="13" letter-spacing="1">ZERO-TRUST PUBLISHING</text>
  <text x="60" y="190" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="32" letter-spacing="-1">Next-Gen Sandboxed CMS</text>
  <text x="60" y="222" fill="#9ca3af" font-family="sans-serif" font-weight="400" font-size="14">Lightning-fast content delivery powered by Rust and WebAssembly.</text>

  <!-- Cards Grid -->
  <g filter="url(#shadow)">
    <!-- Card 1 -->
    <rect x="60" y="260" width="325" height="180" rx="16" fill="#151d30" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <rect x="84" y="284" width="70" height="20" rx="10" fill="rgba(99,102,241,0.2)" />
    <text x="119" y="298" fill="#818cf8" font-family="sans-serif" font-weight="600" font-size="10" text-anchor="middle">SECURITY</text>
    <text x="84" y="330" fill="#f3f4f6" font-family="sans-serif" font-weight="700" font-size="17">Wasm Memory Isolation</text>
    <text x="84" y="356" fill="#9ca3af" font-family="sans-serif" font-size="12">
        <tspan x="84" dy="0">Strict capability policies</tspan>
        <tspan x="84" dy="1.2em">protect server runtimes from malicious guests.</tspan>
    </text>
    <text x="84" y="405" fill="#6366f1" font-family="sans-serif" font-weight="600" font-size="12">Read documentation →</text>

    <!-- Card 2 -->
    <rect x="415" y="260" width="325" height="180" rx="16" fill="#151d30" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <rect x="439" y="284" width="65" height="20" rx="10" fill="rgba(168,85,247,0.2)" />
    <text x="471.5" y="298" fill="#c084fc" font-family="sans-serif" font-weight="600" font-size="10" text-anchor="middle">THEMES</text>
    <text x="439" y="330" fill="#f3f4f6" font-family="sans-serif" font-weight="700" font-size="17">MiniJinja Streaming</text>
    <text x="439" y="356" fill="#9ca3af" font-family="sans-serif" font-size="12">
        <tspan x="439" dy="0">Sub-millisecond dynamic template</tspan>
        <tspan x="439" dy="1.2em">compilation with zero dependencies.</tspan>
    </text>
    <text x="439" y="405" fill="#a855f7" font-family="sans-serif" font-weight="600" font-size="12">Explore templates →</text>
  </g>
</svg>
