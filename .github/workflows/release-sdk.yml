name: Release Plugin SDKs

# AssemblyScript SDK を GitHub Packages (npm) に公開する。
# タグ・GitHub Release・バージョン更新は release-please（release-please.yml）が行うので、
# ここでは現在のチェックアウトに入っているバージョンをそのまま公開する。
# Rust SDK（crates/aegis-plugin-sdk）はコアと同じバージョンで、TinyGo SDK は
# release-please が打つ Go モジュールのタグ（sdk/tinygo/vX.Y.Z）がそのまま配布になる。

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (tag) to publish, e.g. sdk-assemblyscript-v0.2.0. Defaults to the selected branch'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  release-assemblyscript:
    name: Publish AssemblyScript SDK to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@takumi-mr'

      - name: Install AssemblyScript dependencies
        run: npm --prefix sdk/assemblyscript ci

      - name: Verify AssemblyScript SDK
        run: npm --prefix sdk/assemblyscript test

      - name: Publish to GitHub Packages
        run: cd sdk/assemblyscript && npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
