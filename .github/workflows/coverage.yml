name: Coverage

# テストの行カバレッジをクレートごとに測って、実行結果の要約（Job Summary）に出す。
# 計測だけで、しきい値で落とすことはしない（どこが手薄かを数字で見るため）。
# 計測つきで全テストを動かすので重い。PR ごとには動かさず、main への push と手動実行だけにする。
on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE*"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Rust line coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # --all-features は `embed-admin` を有効にして admin/dist をバイナリに埋め込むので、先に作る（ci.yml と同じ）
      - name: Set up Node.js (for the embedded Admin Studio)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Build Admin Studio (for the embedded Admin Studio)
        run: |
          npm --prefix admin ci
          npm --prefix admin run build

      - name: Run all workspace tests with coverage
        run: cargo llvm-cov --workspace --all-features --no-report

      - name: Write the coverage summary
        run: |
          cargo llvm-cov report --json --summary-only --output-path target/coverage.json
          node scripts/coverage-summary.mjs target/coverage.json >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --lcov --output-path target/lcov.info

      - name: Upload the lcov report
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: target/lcov.info
          retention-days: 30
