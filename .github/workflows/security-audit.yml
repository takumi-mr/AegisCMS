name: Security Audit

# 依存クレートの既知の脆弱性（RustSec Advisory DB）を調べる。
# 依存が変わったときに加えて、コードが変わらなくても新しい警告が出るので、毎週も実行する。
# 例外は .cargo/audit.toml
on:
  push:
    branches:
      - main
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - ".cargo/audit.toml"
  pull_request:
    branches:
      - main
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - ".cargo/audit.toml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit
        run: cargo audit --deny warnings
