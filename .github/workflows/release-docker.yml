name: Release Docker Image

# linux/amd64 と linux/arm64 のイメージを GHCR に公開する。
# QEMU だと Rust の release ビルドが非常に遅いため、各アーキテクチャのネイティブ runner で
# 別々にビルドして digest でプッシュし、最後に 1 つのマルチアーキテクチャのタグへまとめる。

on:
  workflow_call:
    inputs:
      version:
        description: 'Release tag to build and publish (e.g. v0.9.0). Adds the version tags (0.9.0, 0.9) and latest'
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to build and publish (e.g. v0.9.0). Adds the version tags (0.9.0, 0.9) and latest. Leave empty to build main'
        required: false
        default: ''
        type: string
      tag:
        description: 'Extra Docker image tag (e.g. latest, test). latest is moved only when this is latest or version is set'
        required: false
        default: 'latest'
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare
        run: |
          # GHCR のイメージ名は小文字のみ
          echo "REGISTRY_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      # リリースのタグを指定したときは、そのタグのソースをビルドする（main が先に進んでいても、タグと中身を一致させる）
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          labels: |
            org.opencontainers.image.title=AegisCMS
            org.opencontainers.image.description=Next-generation secure CMS with Wasm sandboxing
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # タグは付けず、digest だけでプッシュする（タグは merge ジョブが付ける）
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          build-args: |
            CARGO_PROFILE=release

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish the multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Prepare
        run: echo "REGISTRY_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          # この実行は main のブランチ ref で動くため、semver はタグの ref ではなく inputs.version から作る
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' || inputs.tag == 'latest' }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' && inputs.tag != 'latest' }}
          labels: |
            org.opencontainers.image.title=AegisCMS
            org.opencontainers.image.description=Next-generation secure CMS with Wasm sandboxing
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Create the manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY_IMAGE}@sha256:%s " *)

      - name: Inspect the image
        run: docker buildx imagetools inspect "${REGISTRY_IMAGE}:${{ steps.meta.outputs.version }}"
