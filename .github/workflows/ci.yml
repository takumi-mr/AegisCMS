name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-ci:
    name: Rust Tests & Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting (cargo fmt)
        run: cargo fmt --check

      - name: Static code analysis (cargo clippy)
        run: cargo clippy --workspace -- -D warnings

      - name: Run all workspace tests (cargo test)
        run: cargo test --workspace --verbose

  frontend-ci:
    name: Admin Studio Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm --prefix admin ci

      - name: Check formatting (Prettier)
        run: npm --prefix admin run format:check

      - name: Lint (oxlint, zero warnings)
        run: npm --prefix admin run lint

      - name: Run unit tests (Vitest)
        run: npm --prefix admin run test:unit

      - name: Install Playwright browser for Storybook tests
        run: npx --prefix admin playwright install --with-deps chromium

      - name: Run Storybook component & interaction tests (Vitest)
        run: npm --prefix admin run test:storybook

      - name: Typecheck and build Admin Studio
        run: npm --prefix admin run build

      - name: Build Storybook
        run: npm --prefix admin run build-storybook

  plugin-builder-ci:
    name: Plugin Builder Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin-builder/package-lock.json

      - name: Install dependencies
        run: npm --prefix plugin-builder ci

      - name: Check formatting (Prettier)
        run: npm --prefix plugin-builder run format:check

      - name: Lint (oxlint, zero warnings)
        run: npm --prefix plugin-builder run lint

      - name: Run unit tests (Vitest)
        run: npm --prefix plugin-builder run test

      - name: Typecheck and build Plugin Builder
        run: npm --prefix plugin-builder run build

  theme-builder-ci:
    name: Theme Builder Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: theme-builder/package-lock.json

      - name: Install dependencies
        run: npm --prefix theme-builder ci

      - name: Check formatting (Prettier)
        run: npm --prefix theme-builder run format:check

      - name: Lint (oxlint, zero warnings)
        run: npm --prefix theme-builder run lint

      - name: Run unit tests (Vitest)
        run: npm --prefix theme-builder run test

      - name: Typecheck and build Theme Builder
        run: npm --prefix theme-builder run build

  theme-builder-e2e:
    name: Theme Builder E2E (Playwright)
    # 実際のテーマ開発サーバーに対して動かす（サーバーのビルドがあるので他のジョブと並列）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: theme-builder/package-lock.json

      - name: Install dependencies
        run: npm --prefix theme-builder ci

      - name: Install Playwright browser
        run: npx --prefix theme-builder playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm --prefix theme-builder run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: theme-builder-playwright-report
          path: theme-builder/playwright-report
          retention-days: 7

  admin-e2e:
    name: Admin Studio E2E (Playwright)
    # 実サーバーに対して動かす（サーバーのビルドがあるので他のジョブと並列）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm --prefix admin ci

      - name: Install Playwright browser
        run: npx --prefix admin playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm --prefix admin run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: admin/playwright-report
          retention-days: 7

  docker-ci:
    name: Docker Image Build Validation
    # Rust / フロントエンドのジョブを待たずに並列で走らせる（直列だと CI 全体の時間が足し算になる）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: aegiscms:latest
          # ビルド検証のみなので LTO を省いたプロファイルでビルドする（本番イメージは release）
          build-args: |
            CARGO_PROFILE=ci-release
          cache-from: type=gha
          cache-to: type=gha,mode=max
