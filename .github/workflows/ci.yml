name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-ci:
    name: Rust Tests & Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting (cargo fmt)
        run: cargo fmt --check

      - name: Static code analysis (cargo clippy)
        run: cargo clippy --workspace -- -D warnings

      - name: Run all workspace tests (cargo test)
        run: cargo test --workspace --verbose

  frontend-ci:
    name: Admin Studio Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm --prefix admin ci

      - name: Typecheck and build Admin Studio
        run: npm --prefix admin run build

  docker-ci:
    name: Docker Image Build Validation
    needs: [rust-ci, frontend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: aegiscms:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
