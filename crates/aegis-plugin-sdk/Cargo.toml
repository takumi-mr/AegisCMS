[package]
name = "aegis-plugin-sdk"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/aegis-plugin-sdk"
readme = "README.md"
description = "Official Rust SDK for AegisCMS WebAssembly (Wasm) plugins"
keywords = ["wasm", "webassembly", "cms", "plugin", "sdk"]
categories = ["wasm", "api-bindings"]

# ワークスペースの lints は `unsafe_code = "forbid"`（`#[allow]` でも上書きできない）。この SDK だけは Wasm の
# ABI のために `unsafe` が要るので、ワークスペースの表を写して `unsafe_code` だけ `deny` にしている。
# `unsafe` を書いてよいのは `#![allow(unsafe_code)]` を明示した所（abi.rs・host.rs・tests/）だけで、
# ほかの所に混ざるとビルドが落ちる。ワークスペースの lints を変えたら、ここも合わせる
[lints.rust]
unsafe_code = "deny"
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"
linker_messages = "allow"

[lints.clippy]
all = "warn"
needless_borrow = "warn"
redundant_clone = "warn"
clone_on_copy = "warn"

[dependencies]
serde.workspace = true
serde_json.workspace = true
aegis-plugin-macros = { path = "../aegis-plugin-macros", version = "0.8.0" }
