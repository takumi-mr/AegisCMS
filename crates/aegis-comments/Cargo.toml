description = "Reader comments for AegisCMS: submission, moderation (approval, spam checks), threads and notifications"

[lints]
workspace = true

[dependencies]
aegis-core = { path = "../aegis-core" }
aegis-db = { path = "../aegis-db" }
aegis-schema = { path = "../aegis-schema" }
aegis-runtime = { path = "../aegis-runtime" }
aegis-audit = { path = "../aegis-audit" }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
aegis-cache = { path = "../aegis-cache" }
async-trait.workspace = true
tokio = { workspace = true, features = ["full"] }
toml = "0.8"
