[package]
name = "aegis-notify"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Notifications for AegisCMS: templated messages (text and HTML) delivered through channels (email over SMTP, log) from a persistent queue"

[lints]
workspace = true

[dependencies]
aegis-core = { path = "../aegis-core" }
aegis-audit = { path = "../aegis-audit" }
aegis-db = { path = "../aegis-db" }
async-trait.workspace = true
chrono.workspace = true
lettre.workspace = true
minijinja.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
