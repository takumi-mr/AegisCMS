[package]
name = "aegis-auth"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Authentication for AegisCMS: users, passwords, sessions, login rate limiting, local, OpenID Connect and SAML 2.0 providers"

[lints]
workspace = true

[dependencies]
aegis-core = { path = "../aegis-core" }
aegis-db = { path = "../aegis-db" }
argon2.workspace = true
async-trait.workspace = true
chrono.workspace = true
hex.workspace = true
reqwest = { workspace = true, features = ["json", "form"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["sync", "rt"] }
totp-rs.workspace = true
tracing.workspace = true
uuid.workspace = true
jsonwebtoken = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
# mock-idp
axum = { workspace = true, optional = true }
p256 = { workspace = true, optional = true }
rand_core = { workspace = true, optional = true }
# saml
quick-xml = { workspace = true, optional = true }
rsa = { workspace = true, optional = true }
x509-cert = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }

[dev-dependencies]
aegis-cache = { path = "../aegis-cache" }
axum.workspace = true
p256.workspace = true
rand_core.workspace = true
rsa = { workspace = true, features = ["u64_digit"] }
tokio.workspace = true
x509-cert = { workspace = true, features = ["builder"] }

[features]
default = ["oidc", "saml"]
# OpenID Connect login ([auth.oidc]): ID token signature verification via JWKS
oidc = ["dep:jsonwebtoken", "dep:base64"]
# Mock OpenID Connect / SAML IdPs for tests of crates that use aegis-auth
mock-idp = ["oidc", "saml", "dep:axum", "dep:p256", "dep:rand_core"]
# SAML 2.0 login ([auth.saml]): XML signature verification (exclusive C14N, RSA) in pure Rust
saml = ["dep:quick-xml", "dep:rsa", "dep:x509-cert", "dep:flate2", "dep:base64"]
