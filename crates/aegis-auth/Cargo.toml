[package]
name = "aegis-auth"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Authentication for AegisCMS: users, passwords, sessions, login rate limiting, local, OpenID Connect and SAML 2.0 providers"

[lints]
workspace = true

[dependencies]
aegis-core = { path = "../aegis-core" }
aegis-db = { path = "../aegis-db" }
argon2 = "0.5"
async-trait.workspace = true
chrono.workspace = true
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio = { workspace = true, features = ["sync", "rt"] }
tracing.workspace = true
uuid.workspace = true
jsonwebtoken = { version = "9.3", optional = true }
base64 = { version = "0.22", optional = true }
# mock-idp
axum = { workspace = true, optional = true }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem", "jwk"], optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
# saml
quick-xml = { version = "0.42", optional = true }
rsa = { version = "0.9", default-features = false, features = ["std", "pem", "sha2"], optional = true }
x509-cert = { version = "0.2", default-features = false, features = ["pem"], optional = true }
flate2 = { version = "1.1", optional = true }

[dev-dependencies]
aegis-cache = { path = "../aegis-cache" }
axum.workspace = true
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem", "jwk"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rsa = { version = "0.9", features = ["sha2"] }
tokio.workspace = true
x509-cert = { version = "0.2", features = ["builder", "pem"] }

[features]
default = ["oidc", "saml"]
# OpenID Connect login ([auth.oidc]): ID token signature verification via JWKS
oidc = ["dep:jsonwebtoken", "dep:base64"]
# Mock OpenID Connect / SAML IdPs for tests of crates that use aegis-auth
mock-idp = ["oidc", "saml", "dep:axum", "dep:p256", "dep:rand_core"]
# SAML 2.0 login ([auth.saml]): XML signature verification (exclusive C14N, RSA) in pure Rust
saml = ["dep:quick-xml", "dep:rsa", "dep:x509-cert", "dep:flate2", "dep:base64"]
