[package]
name = "aegis-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
aegis-core = { path = "../aegis-core" }
aegis-ast = { path = "../aegis-ast" }
aegis-schema = { path = "../aegis-schema" }
aegis-runtime = { path = "../aegis-runtime" }
aegis-theme = { path = "../aegis-theme" }
aegis-cache = { path = "../aegis-cache" }
aegis-storage = { path = "../aegis-storage" }
aegis-db = { path = "../aegis-db" }
aegis-audit = { path = "../aegis-audit" }
aegis-auth = { path = "../aegis-auth", default-features = false }
aegis-commerce = { path = "../aegis-commerce" }
aegis-comments = { path = "../aegis-comments" }
aegis-tags = { path = "../aegis-tags" }
aegis-notify = { path = "../aegis-notify" }
aegis-forum = { path = "../aegis-forum" }
aegis-contact = { path = "../aegis-contact" }
aegis-search = { path = "../aegis-search", optional = true }
aegis-analytics = { path = "../aegis-analytics", optional = true }
aegis-backup = { path = "../aegis-backup", optional = true }


tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
uuid.workspace = true
chrono.workspace = true
anyhow.workspace = true
toml.workspace = true
thiserror.workspace = true
async-trait.workspace = true
reqwest = { workspace = true, features = ["stream"] }
sha2.workspace = true
hmac.workspace = true
hex.workspace = true
rpassword.workspace = true
redis.workspace = true
zip.workspace = true
ring.workspace = true
url.workspace = true
walkdir.workspace = true

[dev-dependencies]
# A mock OpenID Connect IdP for the SSO handler tests
aegis-auth = { path = "../aegis-auth", features = ["mock-idp"] }
tempfile.workspace = true

[features]
default = ["oidc", "saml", "search", "analytics", "backup"]
# OpenID Connect login ([auth.oidc]): ID token signature verification via JWKS
oidc = ["aegis-auth/oidc"]
# SAML 2.0 login ([auth.saml]): XML signature verification in pure Rust
saml = ["aegis-auth/saml"]
# Site search ([search]): a full-text index of published content (tantivy, CJK bigrams), /search and GET /api/v1/search
search = ["dep:aegis-search"]
# Access analytics ([analytics]): a cookie-less beacon, daily aggregated counts and the Admin Studio dashboard
analytics = ["dep:aegis-analytics"]
# Database & upload storage dump and restore (aegis dump / aegis restore)
backup = ["dep:aegis-backup"]


