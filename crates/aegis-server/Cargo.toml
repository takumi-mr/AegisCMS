[package]
name = "aegis-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
aegis-core = { path = "../aegis-core" }
aegis-ast = { path = "../aegis-ast" }
aegis-schema = { path = "../aegis-schema" }
aegis-runtime = { path = "../aegis-runtime" }
aegis-theme = { path = "../aegis-theme" }


tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
uuid.workspace = true
chrono.workspace = true
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
argon2 = "0.5"
rpassword = "7"
redis.workspace = true
jsonwebtoken = { version = "9.3", optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
toml = "0.8"
# Test-only signing keys for the mock OIDC provider
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem", "jwk"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[features]
default = ["oidc"]
# OpenID Connect login ([auth.oidc]): ID token signature verification via JWKS
oidc = ["dep:jsonwebtoken", "dep:base64"]


