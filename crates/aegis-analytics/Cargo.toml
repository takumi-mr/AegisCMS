hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
aegis-cache = { path = "../aegis-cache" }
tokio = { workspace = true, features = ["full"] }
