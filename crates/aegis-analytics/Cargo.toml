[package]
name = "aegis-analytics"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Privacy-friendly access analytics for AegisCMS: a cookie-less beacon with daily aggregated counts"

[lints]
workspace = true

[dependencies]
aegis-core = { path = "../aegis-core" }
aegis-db = { path = "../aegis-db" }
