[workspace]
resolver = "2"
members = [
    "crates/aegis-core",
    "crates/aegis-ast",
    "crates/aegis-schema",
    "crates/aegis-runtime",
    "crates/aegis-cache",
    "crates/aegis-storage",
    "crates/aegis-db",
    "crates/aegis-audit",
    "crates/aegis-auth",
    "crates/aegis-notify",
    "crates/aegis-commerce",
    "crates/aegis-comments",
    "crates/aegis-tags",
    "crates/aegis-forum",
    "crates/aegis-search",
    "crates/aegis-analytics",
    "crates/aegis-captcha",
    "crates/aegis-contact",
    "crates/aegis-backup",
    "crates/aegis-server",
    "crates/aegis-plugin-macros",
    "crates/aegis-plugin-sdk",
    "crates/aegis-theme",
    "sdk/templates/rust",
    "plugins/official-code-enhancer",
    "plugins/official-shop-rules",
    "plugins/official-order-notifier",
    "plugins/official-blocks",
    "plugins/official-page-toc",
    "plugins/official-back-to-top",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AegisCMS Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/takumi-mr/AegisCMS"
homepage = "https://github.com/takumi-mr/AegisCMS"

[workspace.dependencies]
anyhow = "1.0.104"
argon2 = "0.6"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "multipart"] }
base64 = "0.23"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
flate2 = "1.1"
futures-util = "0.3.34"
hex = "0.4"
hmac = "0.12"
http = "1.5"
jsonwebtoken = { version = "11.1", default-features = false, features = [
    "use_pem",
    "rust_crypto",
] }
lettre = { version = "0.11.23", default-features = false, features = [
    "builder",
    "hostname",
    "smtp-transport",
    "pool",
    "tokio1",
    "tokio1-rustls-tls",
] }
lol_html = "3.0"
minijinja = { version = "3.0", features = ["serde", "json"] }
p256 = { version = "0.14", features = ["ecdsa", "pkcs8", "pem", "getrandom"] }
proc-macro2 = "1.0"
quick-xml = "0.42"
quote = "1.0"
rand_core = { version = "0.6.4", features = ["getrandom"] }
redis = { version = "1.8", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "webpki-roots",
] }
ring = "0.17.14"
rpassword = "7.5"
rsa = { version = "0.9.10", default-features = false, features = [
    "std",
    "pem",
    "sha2",
] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls",
    "sqlite",
    "postgres",
    "mysql",
    "chrono",
    "uuid",
    "json",
] }
tantivy = { version = "0.27", default-features = false, features = [
    "mmap",
    "lz4-compression",
] }
tempfile = "3"
syn = { version = "3.0", features = ["full"] }
thiserror = "2.0"
tokio = { version = "1.54.1", features = ["full"] }
totp-rs = { version = "6.0", features = ["gen_secret", "qr", "otpauth", "serde"] }
toml = "1.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1.29", features = ["v4", "serde"] }
walkdir = "2.5"
wasmtime = "50.0"
wat = "1.262"
x509-cert = { version = "0.3", default-features = false, features = ["pem"] }
zip = { version = "9.1", default-features = false, features = ["deflate"] }


[workspace.lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"
linker_messages = "allow"

[workspace.lints.clippy]
all = "warn"
needless_borrow = "warn"
redundant_clone = "warn"
clone_on_copy = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# CI の Docker ビルド検証用。最適化レベルは release と同じだが、LTO と codegen-units=1 を外して
# 最終リンク時の全体最適化（CI で約 3 分）を省く。本番イメージは release のまま
[profile.ci-release]
inherits = "release"
lto = false
codegen-units = 16

# デバッグ情報を行番号だけにする（バックトレースの行番号は残る）。フルの変数情報は
# wasmtime などの依存を含めて数百 MB になり、テストバイナリのリンクを遅くするため
[profile.dev]
debug = "line-tables-only"

# RSA の鍵生成（SAML のモック IdP）が最適化なしでは非常に遅いため、テストでも最適化する
[profile.dev.package.num-bigint-dig]
opt-level = 3
