[workspace]
resolver = "2"
members = [
    "crates/aegis-core",
    "crates/aegis-ast",
    "crates/aegis-schema",
    "crates/aegis-runtime",
    "crates/aegis-server",
    "crates/aegis-plugin-macros",
    "crates/aegis-plugin-sdk",
    "crates/aegis-theme",
    "plugins/template-rust",
    "plugins/official-code-enhancer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AegisCMS Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "mysql", "chrono", "uuid", "json"] }

uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
lol_html = "3.0"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
minijinja = { version = "2.7", features = ["loader", "json"] }



[workspace.lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[workspace.lints.clippy]
all = "warn"
needless_borrow = "warn"
redundant_clone = "warn"
clone_on_copy = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
