[package]
name = "aegis-plugin-order-notifier"
version = "0.2.0"
edition = "2021"
authors = ["AegisCMS Core Team"]
description = "Official Wasm plugin that posts new and updated shop orders to Slack or a JSON webhook"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aegis-plugin-sdk = { path = "../../crates/aegis-plugin-sdk" }
serde.workspace = true
serde_json.workspace = true
