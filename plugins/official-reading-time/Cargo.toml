[package]
name = "aegis-plugin-reading-time"
version = "0.2.0"
edition = "2021"
authors = ["AegisCMS Core Team"]
description = "Official Wasm plugin that displays estimated reading time and word/character count on articles and pages"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aegis-plugin-sdk = { path = "../../crates/aegis-plugin-sdk" }
serde_json.workspace = true

