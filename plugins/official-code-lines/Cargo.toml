edition = "2021"
authors = ["AegisCMS Core Team"]
description = "Official Wasm plugin that adds line numbers and file names to code blocks"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aegis-plugin-sdk = { path = "../../crates/aegis-plugin-sdk", version = "0.1.0" }
serde_json.workspace = true
