[package]
name = "aegis-plugin-template"
version = "0.1.0"
edition = "2021"
authors = ["AegisCMS Plugin Developer"]
description = "Official Rust WebAssembly plugin template for AegisCMS"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aegis-plugin-sdk = { path = "../../crates/aegis-plugin-sdk", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

