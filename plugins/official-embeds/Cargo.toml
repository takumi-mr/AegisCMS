[package]
name = "aegis-plugin-embeds"
version = "0.2.0"
edition = "2021"
authors = ["AegisCMS Core Team"]
description = "Official Wasm plugin with blocks that embed external services: YouTube, Vimeo, OpenStreetMap, CodePen, Google Maps, Google Calendar and Google Forms"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aegis-plugin-sdk = { path = "../../crates/aegis-plugin-sdk" }
serde_json.workspace = true
