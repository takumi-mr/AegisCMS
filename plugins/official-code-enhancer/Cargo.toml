[package]
name = "aegis-plugin-code-enhancer"
version = "0.1.0"
edition = "2021"
authors = ["AegisCMS Core Team"]
description = "Official Wasm plugin for syntax highlighting, external code themes, and Mermaid diagram rendering"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aegis-plugin-sdk = { path = "../../crates/aegis-plugin-sdk", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
