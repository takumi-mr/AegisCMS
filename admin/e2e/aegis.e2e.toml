# E2E テスト（admin/e2e）用のサーバー設定。e2e/start-server.mjs がリポジトリのルートで起動する
# （パスはルートからの相対パス）。DB とアップロードは target/e2e/ に作り、起動のたびに消す

[server]
host = "127.0.0.1"
port = 18080

[database]
backend = "sqlite"
url = "sqlite://target/e2e/aegis.db?mode=rwc"

[storage]
backend = "local"

[storage.local]
upload_dir = "target/e2e/uploads"
public_url_prefix = "/uploads"

[paths]
schemas_dir = "schemas"
plugins_dir = "plugins"
admin_dist_dir = "admin/dist"
themes_dir = "themes"

# プラグインはテストの中で Admin Studio から有効にする
[plugins]
enabled = []

[runtime]
# テストを並列で動かさないので小さくてよい（プールのアドレス空間を CI で確保しすぎない）
instance_pool_size = 4

# ログインロックアウトの E2E 検証用（3回失敗で1分間ロック）
[auth.login_rate_limit]
enabled = true
max_failures_per_user = 3
window_secs = 900
lockout_secs = 60

# EC 機能の E2E 検証用
[commerce]
enabled = true
currency = "jpy"
provider = "manual"
public_url = "http://127.0.0.1:18080"

# 招待・通知の E2E 検証用（log チャンネルなので外部 SMTP 不要）
[notifications]
enabled = true
channels = ["log"]

# コメント（comments.spec.ts）。承認制の切り替えはテストの中で Admin Studio から
[comments]
enabled = true
content_types = ["article"]

# 通知（notifications.spec.ts）。SMTP サーバーが無いのでログに出す
[notifications]
enabled = true
channels = ["log"]
